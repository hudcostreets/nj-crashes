config:
  aws:region: us-east-1
  nj-crashes-batch:vcpu: "16"
  nj-crashes-batch:memory_mib: "65536"
  # Legacy RAC stack (AWS 006196295121, backend s3://nj-crashes/pulumi/batch);
  # retiring per specs/rac-to-hccs.md. Data via the task role's S3 grants.
  nj-crashes-batch:s3_bucket: nj-crashes
  nj-crashes-batch:import_ecr: "true"
  # Injected into `secrets: true` jobdefs; the execution role gets read access.
  nj-crashes-batch:secrets:
    FARGATE_GITHUB_RW_TOKEN:
      arn: arn:aws:secretsmanager:us-east-1:006196295121:secret:nj-crashes/fargate-github-rw-token-jVJlSc
  # One Batch job definition per entry (`batch/submit -d <name>`). This file is
  # the live state: to run a reproc at a new commit, push it to GitHub, bump
  # `ref` here, commit, and `pulumi up` (which builds + pushes the image).
  nj-crashes-batch:jobdefs:
    # Reproducibility audit (x86 vs arm64 arch-invariance); prebuilt image.
    nj-crashes:
      arch: X86_64
      image: 006196295121.dkr.ecr.us-east-1.amazonaws.com/nj-crashes-reproc:a16025228b2-amd64
    # DAG reproc / targeted rebuilds, with push-back to `reproc-results/*`.
    nj-crashes-reproc:
      arch: ARM64
      ref: 3e71f9b705b0802b3646f6e8bb35af7d6ab99267
      secrets: true
encryptionsalt: v1:MI0r5kBWrcc=:v1:gjrZ9mishg2L6Fkp:ZAD+anfJIvStgQ+e8L+6PvUQCBuqeA==
