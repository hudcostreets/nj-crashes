ignoredBuiltDependencies:
  - '@fortawesome/fontawesome-common-types'
  - '@fortawesome/fontawesome-svg-core'
  - '@fortawesome/free-solid-svg-icons'
  - es5-ext
  - esbuild
# Security floors (Dependabot): transitive deps pinned to their patched
# release *within the major already in use*, so no major moves implicitly.
overrides:
  vite: ^6.4.3
  # Exception to the same-major rule: GHSA-jrc7-96c5-q579 has no 4.x/5.x fix.
  # `plotly.js` depends on `maplibre-gl` 4 only for its `map` traces (unused here).
  maplibre-gl@4: ^6.4.1
  '@75lb/deep-merge': ^1.1.2
  '@babel/core': ^7.29.6
  '@babel/runtime': ^7.26.10
  baseline-browser-mapping: ^2.11.0
  braces@3: ^3.0.3
  browserslist: ^4.28.7
  immutable@4: ^4.3.9
  nanoid@3: ^3.3.18
  picomatch@2: ^2.3.2
  postcss: ^8.5.23
  protocol-buffers-schema: ^3.6.1
  rollup: ^4.59.0
  ws@8: ^8.21.0
  yaml@1: ^1.10.3
