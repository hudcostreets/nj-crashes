# Per-road data notes, emitted by `njdot roads build` as `road-notes.parquet` (`njdot/road_notes.py`;
# schema and evidence in specs/road-anomalies.md). Each note explains a known change in how NJDOT's
# data covers or codes the roads it selects, for road / corridor pages to show beside their per-year
# counts. Muni-wide notes about a police department take `subt: [2, 3, 5, 6, 7]` (not interstates,
# toll roads or ramps, which the State Police patrol). Coverage gaps (a town's reports missing for some
# years) are also found and noted automatically (`muni_gaps`); a note here with the same scalar `cc` /
# `mc` and overlapping years replaces the automatic one. `kind`: reporting (an agency reports differently), coverage (crashes missing from NJDOT's
# data), coding (NJDOT codes locations differently), unexplained (a verified step with no cause found).

- id: jersey-city-pdo-2020
  kind: reporting
  years: [2020, 2025]
  title: Jersey City reports fewer property-damage crashes since 2020
  text: >
    Jersey City's property-damage-only crash reports fell 42% in 2020 (7,006 → 4,051) and stayed 24–35%
    below 2019 through 2025, while outside Hudson County they recovered to 7% below. Its injury crashes are back at
    2019 levels (1,532 in 2019; 1,535 in 2024). So most Jersey City roads show a step down from 2019 to
    2020+ that is mostly in minor crashes, and not a change on the road itself.
  where: {cc: 9, mc: 6, subt: [2, 3, 5, 6, 7]}

- id: newark-2006-07-gap
  kind: coverage
  years: [2006, 2007]
  title: Many Newark crash reports are missing for 2006–07
  text: >
    NJDOT's data has 8,660 and 6,377 Newark crashes in 2006 and 2007, vs 13,293 in 2005 and 12,304 in
    2008; Newark Police's own reports fell to 5,900 and 3,948 (from ~10,000), evenly across all months and
    severities. The gap is worst in the North Ward: north of about 40.755° N only ~10% of the usual
    crashes are in the data, vs ~65–80% in the rest of the city.
  where: {cc: 7, mc: 14, subt: [2, 3, 5, 6, 7]}

- id: edgewater-2010-12-gap
  kind: coverage
  years: [2010, 2012]
  title: Edgewater's crash reports are missing from May 2010 through 2012
  text: >
    NJDOT's data has Edgewater Police crash reports through April 2010 and again from 2013, but almost none
    in between: 136 Edgewater crashes in 2010 (all but one in January–April), 3 in 2011 and 3 in 2012, vs
    ~350–495 a year before and after.
  where: {cc: 2, mc: 13, subt: [2, 3, 5, 6, 7]}

- id: port-authority-2019
  kind: coverage
  years: [2001, 2018]
  title: Port Authority police crashes are in NJDOT's data only from 2019
  text: >
    Crashes reported by the Port Authority Police (the George Washington Bridge and its approach, the
    Lincoln and Holland Tunnels and their helix / approaches, the Goethals Bridge, Port Newark) are all but
    absent before 2019 (at most 13 a year) and number 1,350–2,526 a year in 2019–22. On these roads the
    jump in 2019 is that change: the George Washington Bridge had 2 crashes in 2018 and 484 in 2019, all
    reported by the Port Authority.
  where:
    slug: >-
      bergen/fort-lee/(george-washington-bridge|interstate-95|interstate-95-express)|hudson/weehawken/(lincoln-tunnel|nj-495)|hudson/state-highway-495|hudson/jersey-city/(holland-tunnel|12th-street)|essex/newark/(port-street|corbin-street)|union/interstate-278|union/elizabeth/goethals-bridge

- id: express-lanes-2023
  kind: coding
  years: [2023, 2025]
  title: From 2023, crashes are coded to express lanes separately
  text: >
    NJDOT's 2023+ crash data (the AASHTO format) codes crashes to the express-lane routes (SRIs like
    00000095E_) of divided highways, which 2001–22 data rarely or never used: New Jersey Turnpike express
    lanes had 0 crashes a year in 2019–22 and 732, 1,646 and 1,694 in 2023–25; Garden State Parkway express
    lanes 0 → 111, 246, 319. The same crashes left the local lanes' roads. Compare the whole corridor, whose
    totals are continuous (the Turnpike's main line and express lanes: 6,447 in 2022, 5,973 / 6,500 / 6,432
    in 2023–25).
  where:
    sris: '(^|,)00000[0-9]{3}E'
  corridors: true

- id: turnpike-2012-13
  kind: unexplained
  years: [2012, 2013]
  title: Fewer Turnpike crashes reported in 2012–13
  text: >
    NJDOT's data has 5,310 and 5,010 New Jersey Turnpike crashes in 2012 and 2013, vs 6,827 in 2011 and
    5,925 in 2014 (about 22% fewer), and 34% fewer north of Newark (Bergen and Hudson: 1,205 / 1,172 vs
    1,831 / 1,643), nearly all State Police reports from its Newark station. State Police crash reports
    statewide fell only 11% in 2012; no cause is known.
  where:
    slug: '[a-z-]+/new-jersey-turnpike'
  corridors: true

- id: essex-st-rt17-2003-07
  kind: unexplained
  years: [2003, 2007]
  title: A cluster of crashes at the Route 17 interchange in 2003–07
  text: >
    In 2003–07 NJDOT coded 80–126 crashes a year to Essex Street (CR 56) at the Route 17 interchange, all at
    one milepost (3.48), most with cross street "RT 17"; from 2008 it's 0–11 a year there. The crashes don't
    reappear on Route 17 or its ramps, and Maywood's and Rochelle Park's totals fell by about the same
    amount, so it may be a real change (e.g. the interchange's layout) or a reporting one.
  where:
    slug: bergen/maywood/west-essex-street|bergen/essex-street|bergen/rochelle-park/essex-street

- id: newark-2023-25
  kind: coverage
  years: [2023, 2025]
  title: Most Newark crash reports are missing from September 2024
  text: >
    Crashes on Newark's streets (not the interstates, Turnpike or ramps, which other police patrol) number
    ~870 a month in 2021–22. From September 2023 its property-damage reports fall ~40% while injury crashes
    hold steady (a change in reporting minor crashes); from September 2024 all of them fall to ~280 a month
    (~70% fewer), injury crashes as much as the rest, while crashes on the interstates and Turnpike through
    Newark don't change. So most of Newark's crash reports since September 2024 are missing from NJDOT's
    data, and its roads' counts for 2023–25 are too low (Broadway: ~180 a year in 2021–22; 119, 93 and 37
    in 2023–25).
  where: {cc: 7, mc: 14, subt: [2, 3, 5, 6, 7]}

- id: flemington-circle-coding
  kind: coding
  title: Flemington Circle crashes are split between US 202 and NJ 31 differently over the years
  text: >
    NJDOT codes a crash at the Flemington Circle to US 202 (MP ~11.4) or to NJ 31 (MP ~22.0). The circle's
    total is steady (264–349 crashes per three years, 2001–24), but NJ 31's share fell from ~40% in 2001–06
    to 5–13% in 2010–21 (22% in 2022–24): its circle crashes moved to US 202, not away. Compare the two
    roads' circle crashes together.
  where: {slug: 'hunterdon/(state-highway-31-2|us-highway-202-2)'}

- id: woodbridge-green-st-us9
  kind: reporting
  years: [2016, 2025]
  title: Crashes at Green Street and US 9 are recorded under US 9 since about 2016
  text: >
    Police reports put crashes at the Green Street / US 9 interchange under Green Street (with US 9 the
    cross street) 163 times in 2007–09 but only 11–17 per three years from 2016, while the reports under US 9
    (Green Street the cross street) held at ~115–180. So Green Street's count at US 9 fell mostly because
    of which road the reports name; the interchange's crashes are in US 9's count and in both roads'
    intersection totals. (The two together also fell, from ~320 per three years in 2007–09 to ~130–150.)
  where: {slug: 'middlesex/woodbridge/green-street'}

- id: port-authority-2019-22
  kind: coverage
  years: [2019, 2021]
  title: Port Authority police crashes grow each year in 2019–22
  text: >
    Port Authority police crashes, new to NJDOT's data in 2019, grow each year to 2022 statewide (1,350,
    1,541, 2,299, 2,526), through 2020's drop elsewhere. On the Lincoln Tunnel / NJ 495 corridor they're
    234, 263, 431 and 524 in 2019–22, while its other crashes hold at ~90–100 a year: 2019–21 look low
    next to 2022+, likely because fewer of the Port Authority's reports reached the data, not fewer crashes.
  where:
    slug: 'hudson/state-highway-495|hudson/weehawken/(lincoln-tunnel|nj-495)'
  corridors: true

- id: pip-police-2013-18
  kind: coverage
  years: [2013, 2018]
  title: Palisades Interstate Parkway crashes are missing from mid-2013 through 2018
  text: >
    NJDOT's data has 134–241 crashes a year on the Palisades Interstate Parkway in 2001–12 (Parkway Police
    reports), 27 in 2013, 0–2 a year in 2014–18, and 237 in 2019 (119–315 a year since). The Parkway
    Police's reports for mid-2013 through 2018 are missing from the data.
  where:
    slug: 'bergen/palisades-interstate-parkway|bergen/fort-lee/palisades-interstate-parkway-spur'

- id: mannington-pennsville-pd-2011-14
  kind: reporting
  years: [2011, 2014]
  title: Pennsville police reported Mannington's crashes in 2011–14, and more of them
  text: >
    In 2011–14 most of Mannington's crash reports come from the Pennsville Police (193, 355, 242, 185 a year,
    vs ~80 in 2010 and 13–51 after) instead of the State Police (81 in 2010, 15–50 in 2011–13), and
    Mannington's total rises from 166 (2010) to 252 / 393 / 264 / 259, then 115 (2015). Its roads (NJ 45 /
    Salem–Woodstown Rd: ~30 a year, 61–101 in 2012–13) show the same step: more crashes reported, not
    necessarily more crashes.
  where: {cc: 17, mc: 6, subt: [2, 3, 5, 6, 7]}

- id: secondary-carriageway-2023
  kind: coding
  years: [2023, 2025]
  title: From 2023, crashes on a route's second carriageway are coded separately
  text: >
    NJDOT's 2023+ data (the AASHTO format) codes crashes to routes' secondary SRIs (like 00000501_S), which
    2001–22 data never used (0 crashes a year; 7,272 / 20,421 / 24,035 in 2023–25). Where the second
    carriageway is a separately named street, its crashes were counted on the main route's road before
    2023: Englewood's Dean Street (CR 501's second carriageway) had ~0 a year through 2022 and 63 / 103 / 114
    in 2023–25, while Grand Avenue / Engle Street (CR 501's main line) fell from ~210 to 153 / 123 / 92;
    together they're continuous.
  where:
    sris: '^(?=.*(?:^|,)([0-9]{8})_S(?:,|$))(?!.*(?:^|,)\1__(?:,|$))'

- id: us1-truck-coding
  kind: coding
  title: US 1&9 Truck's crashes are coded inconsistently over the years
  text: >
    NJDOT's coding of US 1&9 Truck (SRI 00000001T_) crashes changes over time: 382 / 575 crashes a year in
    2001–02, 47–80 in 2006–09 (when Jersey City and Kearny crashes on it were mostly coded to plain US 1
    without a milepost, and many are on no road), 153–376 from 2010. Crashes at Charlotte Circle / Newark
    Avenue fall on Wallis Avenue (MP 3.55–3.80: 125 / 186 in 2001–02, 79 / 58 in 2019–20) or on US 1&9
    Truck (MP 3.3–3.5, 2003–18), depending on the year's MP coding. Compare the two roads together, and
    with care in 2006–09.
  where: {slug: 'hudson/(jersey-city/wallis-avenue|us-highway-1-truck)'}
