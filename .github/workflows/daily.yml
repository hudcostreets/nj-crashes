name: "Daily: refresh NJSP data, update www"
on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        description: "Force re-run all stages (ignore freshness)"
        default: false
      targets:
        type: string
        description: "Specific DVX targets to run (space-separated .dvc paths, empty = all)"
concurrency:
  group: daily
  cancel-in-progress: false
env:
  # S3 side is HCCS R2 now (dvx cache, `NJC_S3` writes: og-image, njsp parquets).
  # The S3 API endpoint carries the account, so these `AWS_*` are R2, not AWS.
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_HCCS_RW_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_HCCS_RW_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  AWS_ENDPOINT_URL: https://2363642879f18d37d52dca114059937e.r2.cloudflarestorage.com
  NJC_S3: s3://crashes
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  # Cloudflare = HCCS for everything: d1-import → HCCS D1 (via `api/wrangler.toml`
  # ids / D1 names in the HCCS account), deploy → HCCS `crashes` Pages. Separate
  # cred from the AWS_*/R2 above. (The RAC `CLOUDFLARE_*` repo secrets are unused.)
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_HCCS_INFRA_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 2363642879f18d37d52dca114059937e
  CF_HCCS_INFRA_TOKEN: ${{ secrets.CF_HCCS_INFRA_TOKEN }}
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
  SLACK_CI_CHANNEL_ID: ${{ vars.SLACK_CI_CHANNEL_ID }}
jobs:
  run:
    name: DVX pipeline
    runs-on: ubuntu-latest
    env:
      DVX: dvx run --commit --push each -r r2 ${{ inputs.force == true && '--force' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GH_TOKEN }}
      - uses: astral-sh/setup-uv@v7
        with:
          # Match Batch (`python:3.13-slim`) + local; the runner's system Python moved to 3.14, which some deps (`pyogrio`, `pygit2`, `pyarrow`) have no wheels for.
          python-version: "3.13"
          enable-cache: true
      - name: Install Python dependencies
        run: |
          uv sync
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: www/pnpm-lock.yaml
      - name: Install www dependencies
        run: cd www && pnpm install
      - name: Configure Git author
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'ryan-williams@users.noreply.github.com'
      # The crash log appends to its previous output. Restore that checkpoint
      # even when stale; DVX otherwise fetches only inputs needed for rebuilds.
      - name: Restore crash-log checkpoint
        if: ${{ !inputs.targets }}
        run: dvx pull -r r2 njsp/data/crash-log.parquet.dvc
      - name: DVX status
        run: dvx status
      # === Pipeline stages (sequential, matching old daily.yml order) ===
      - name: Refresh NJSP data
        if: ${{ !inputs.targets }}
        run: $DVX njsp/data/refresh.dvc
      # Harmonize BEFORE update_pqts: `njsp update_pqts` maps NJSP muni codes
      # to NJGIN via `muni_codes.parquet` and *raises* on an unmapped
      # `(cc, mc_sp)`, so a muni's first-ever NJSP fatal wedges the pipeline
      # unless the map is refreshed first. Harmonize reads the raw XMLs, not
      # `crashes.parquet`, so it can run here. See `njsp/data/harmonize.dvc`.
      - name: Harmonize county/muni codes
        if: ${{ !inputs.targets }}
        run: $DVX njsp/data/harmonize.dvc
      - name: Update NJSP parquets
        if: ${{ !inputs.targets }}
        run: $DVX njsp/data/crashes.parquet.dvc www/public/njsp/crashes.db.dvc
      - name: Update crash log
        if: ${{ !inputs.targets }}
        run: $DVX njsp/data/crash-log.parquet.dvc
      - name: Refresh annual summaries
        if: ${{ !inputs.targets }}
        run: $DVX njsp/data/summaries.dvc
      - name: "Fetch ≈1yr of git history"
        if: ${{ !inputs.targets }}
        run: |
          since="$(date --date="$(date +%Y-%m-%d) -375 day" +%Y-%m-%d)"
          git fetch --shallow-since "$since" origin ${{ github.ref_name }} || true
      - name: Update NJSP projections
        if: ${{ !inputs.targets }}
        run: $DVX www/public/njsp/projections.dvc
      - name: Re-match NJSP↔NJDOT (incl. AASHTO)
        if: ${{ !inputs.targets }}
        run: $DVX njsp/data/njsp_njdot_match.parquet.dvc
      - name: Supplement AASHTO with NJSP-only residuals
        if: ${{ !inputs.targets }}
        run: $DVX njdot/data/aashto_supplemented_crashes.parquet.dvc
      # DVX restores current person supplements without fetching their
      # per-year normalization inputs; stale stages resolve inputs on demand.
      - name: Rebuild cmymc.db (year-stats, victim-severity)
        if: ${{ !inputs.targets }}
        run: $DVX www/public/njdot/cmymc.db.dvc
      - name: Aggregate NJDOT crashes for FE
        if: ${{ !inputs.targets }}
        run: $DVX www/public/data/njdot/ymccmc.dvc www/public/data/njdot/ymccmcs.dvc
      - name: Update www CSVs
        if: ${{ !inputs.targets }}
        run: $DVX www/public/njsp/csvs.dvc
      - name: Post to Slack
        if: ${{ !inputs.targets }}
        run: $DVX njsp/data/slack_post.dvc
      # Cells refresh for the map. DVX-gated: the raw S2 index + rollup DB only
      # rebuild on days the crash data actually changed. `cells-s2.db` (the D1
      # rollup source behind every all-years `/v1/cells` request) is built
      # straight from the raw index by duckdb bit-math — no pyramid — so it
      # stays memory-bounded and feeds the d1-import below. The parquet pyramid
      # (year-filtered queries) and its R2 push are deferred: the pyramid build
      # OOMs on the CI runner, and the push needs R2 creds (see 4b).
      #
      # These two stages were `raw/h3_r15` + `cells.db` until h3-removal Phase
      # 3 — i.e. the daily job was refreshing the *dead* grid while the live
      # one went stale.
      - name: Rebuild cells raw S2 index
        if: ${{ !inputs.targets }}
        run: $DVX data/cells/raw/s2_l21.dvc
      - name: Rebuild cells rollup DB (D1 source)
        if: ${{ !inputs.targets }}
        run: $DVX data/cells/cells-s2.db.dvc
      - name: Install api dependencies
        if: ${{ !inputs.targets }}
        run: cd api && pnpm install
      - name: Sync crash DBs (NJSP, cmymc, cells) → D1
        if: ${{ !inputs.targets }}
        run: $DVX api/d1-import.dvc
      - name: Regenerate homepage OG mosaic (→ S3)
        if: ${{ !inputs.targets }}
        run: $DVX www/og-image.dvc
      - name: Deploy www to CF Pages
        if: ${{ !inputs.targets }}
        run: $DVX www/deploy.dvc
      - name: Run custom targets
        if: ${{ inputs.targets }}
        run: $DVX ${{ inputs.targets }}
      - name: Report materialized NJDOT data
        if: always()
        run: find njdot/data -type f ! -name '*.dvc' ! -name '.gitignore' -printf '%s %p\n' | sort -nr
      - name: "Notify #crash-bot-ci on failure"
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash .github/scripts/notify-ci-failure.sh
