name = "crashes-cells-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "CELLS_BUCKET"
bucket_name = "nj-crashes"

# Per-cell all-years rollup (counts + labels), one row/cell for r6-r15.
# Built by `njdot compute cells db`, imported via `api/scripts/d1-import.sh`.
# Serves the default (all-years, all-severity) `/v1/cells` query as a single
# indexed `h3 BETWEEN` range scan; year/severity-filtered queries fall back
# to the R2 parquet pyramid.
[[d1_databases]]
binding = "CELLS_DB"
database_name = "cells"
database_id = "8d71621d-7b48-4018-b3fe-0db68ec528ad"

# S2 rollup binding — mirrors CELLS_DB but for the S2 grid
# (`cells_s2_l{level}` tables built from `data/cells/cells-s2.db`,
# imported via `api/scripts/d1-import.sh cells-s2`). Optional —
# `handleCellsRequestS2` falls through to the parquet pyramid when
# absent (so this binding is optional but preferred — the D1 fast
# path is much cheaper than reading R2 parquet per request).
[[d1_databases]]
binding = "CELLS_S2_DB"
database_name = "cells-s2"
database_id = "ed836697-7116-4a92-ae87-c304d616d1cd"

# Picker-tuning preference votes from `/tune/ab` (see `src/tune.ts`,
# `sql/tune.sql`, `specs/tune-preference-learning.md`). Reads are public;
# writes need the `TUNE_TOKEN` secret (`wrangler secret put TUNE_TOKEN`).
[[d1_databases]]
binding = "TUNE_DB"
database_name = "tune"
database_id = "9ffa6e1b-214f-4746-a263-030d5d95f7bf"

[dev]
port = 51895

[vars]
CORS_ORIGIN = "*"
# Subpath within the project-wide R2 bucket for cells-API artifacts. The
# pipeline writes manifest/raw/pyramid under this prefix; the worker
# reads under it. Other crashes-project data (parquets/, csvs/, geo/...)
# can share the bucket at sibling prefixes.
CELLS_PREFIX = "cells"
# Informational only — the worker reads these from `manifest.json` at
# request time (the res-gate uses `manifest.base_res`); kept here in sync
# for humans. base is r15 since the pyramid gained the s{7,8,9}_r15 combos.
BASE_RES = "15"
SHARD_RES = "4"
PYRAMID_LEVELS = "6,7,8,9,10,11"
TOPK = "10"
