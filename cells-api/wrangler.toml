name = "crashes-cells-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "CELLS_BUCKET"
bucket_name = "crashes"

# Per-cell all-years rollup (counts + labels), one row per cell per level
# (`cells_s2_l{level}`, built from `data/cells/cells-s2.db` and imported via
# `api/scripts/d1-import.sh cells-s2`). Serves any all-years `/v1/cells`
# query as a single indexed `cellid BETWEEN` range scan; year-filtered
# queries — and any D1 failure — fall back to the R2 parquet pyramid, so
# the binding is optional but very much preferred.
#
# The H3 `CELLS_DB` binding that used to sit here went away with
# `specs/h3-removal.md` Phase 2.
[[d1_databases]]
binding = "CELLS_S2_DB"
database_name = "cells-s2"
database_id = "5f3f02b6-4ff6-439d-be66-a9d1436c649b"

# Picker-tuning preference votes from `/tune/ab` (see `src/tune.ts`,
# `sql/tune.sql`, `specs/tune-preference-learning.md`). Reads are public;
# writes need the `TUNE_TOKEN` secret (`wrangler secret put TUNE_TOKEN`).
[[d1_databases]]
binding = "TUNE_DB"
database_name = "tune"
database_id = "b9eea284-d436-4045-bb3b-c30ebf53f9b7"

[dev]
port = 51895

[vars]
CORS_ORIGIN = "*"
# Cells root within the project-wide R2 bucket. The worker reads
# `{CELLS_PREFIX}/manifest.json` (re-read each minute) and the shards it
# names. Schema-6 manifests (`njdot compute cells push`,
# specs/cells-immutable-keys.md) name immutable content-hashed keys
# (`s2_pyramid/s2_l{L}/{shard}.{hash:12}.parquet`); older ones mean the
# fixed-name layout (`s2_pyramid/s2_l{L}/{shard}.parquet`), which is what
# `cells-e710a3c/` (the 2026-09-28 promotion, pushed by the old
# `aws s3 sync`) holds.
#
# Promotion runbook (no deploy once CELLS_PREFIX is "cells"):
#   dvx pull data/cells/s2_pyramid.dvc data/cells/raw/s2_l21.dvc
#   infra/r2-run njdot compute cells push -n     # dry run: copies/uploads
#   infra/r2-run njdot compute cells push -A     # stage; prints <v>
#   infra/r2-run njdot compute cells activate <v>   # cutover (≤60 s)
#   infra/r2-run njdot compute cells activate <prev v>   # rollback
#   infra/r2-run njdot compute cells gc [-a]     # after ≥48 h
# One-time migration: deploy this code (still on cells-e710a3c), run
# `cells push` (→ `cells/`, not yet live), then set both CELLS_PREFIXes
# to "cells" and deploy dev, then prod.
CELLS_PREFIX = "cells-e710a3c"

# Dev tier: `wrangler deploy --env dev` → `crashes-cells-api-dev`, served at
# `crashes-cells-dev.hccs.dev` (domain via `infra/`) for `dev.crashes.hccs.dev`.
# New worker code against the *prod* data (it only reads R2 / `cells-s2`), so
# worker changes can be checked before prod. No `TUNE_TOKEN` secret here, so
# tune votes are read-only. Wrangler doesn't inherit bindings/vars into envs,
# hence the repetition.
[env.dev]
name = "crashes-cells-api-dev"

[[env.dev.r2_buckets]]
binding = "CELLS_BUCKET"
bucket_name = "crashes"

[[env.dev.d1_databases]]
binding = "CELLS_S2_DB"
database_name = "cells-s2"
database_id = "5f3f02b6-4ff6-439d-be66-a9d1436c649b"

[[env.dev.d1_databases]]
binding = "TUNE_DB"
database_name = "tune"
database_id = "b9eea284-d436-4045-bb3b-c30ebf53f9b7"

[env.dev.vars]
CORS_ORIGIN = "*"
CELLS_PREFIX = "cells-e710a3c"
