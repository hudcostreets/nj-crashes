name = "crashes-cells-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "CELLS_BUCKET"
bucket_name = "nj-crashes"

# Per-cell all-years rollup (counts + labels), one row per cell per level
# (`cells_s2_l{level}`, built from `data/cells/cells-s2.db` and imported via
# `api/scripts/d1-import.sh cells-s2`). Serves any all-years `/v1/cells`
# query as a single indexed `cellid BETWEEN` range scan; year-filtered
# queries — and any D1 failure — fall back to the R2 parquet pyramid, so
# the binding is optional but very much preferred.
#
# The H3 `CELLS_DB` binding that used to sit here went away with
# `specs/h3-removal.md` Phase 2.
[[d1_databases]]
binding = "CELLS_S2_DB"
database_name = "cells-s2"
database_id = "ed836697-7116-4a92-ae87-c304d616d1cd"

# Picker-tuning preference votes from `/tune/ab` (see `src/tune.ts`,
# `sql/tune.sql`, `specs/tune-preference-learning.md`). Reads are public;
# writes need the `TUNE_TOKEN` secret (`wrangler secret put TUNE_TOKEN`).
[[d1_databases]]
binding = "TUNE_DB"
database_name = "tune"
database_id = "9ffa6e1b-214f-4746-a263-030d5d95f7bf"

[dev]
port = 51895

[vars]
CORS_ORIGIN = "*"
# Subpath within the project-wide R2 bucket for cells-API artifacts. The
# pipeline writes manifest/raw/pyramid under this prefix; the worker
# reads under it. Other crashes-project data (parquets/, csvs/, geo/...)
# can share the bucket at sibling prefixes.
CELLS_PREFIX = "cells"
